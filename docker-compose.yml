name: multimodal-video-intelligence

services:
  pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uav_search}
      POSTGRES_USER: ${POSTGRES_USER:-mvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    expose: ["5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvi} -d ${POSTGRES_DB:-uav_search}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ch:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-uav_search}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mvi}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    command: ["--max_server_memory_usage=${CLICKHOUSE_MAX_MEMORY_BYTES:-0}"]
    expose: ["8123", "9000"]
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user '${CLICKHOUSE_USER:-mvi}' --password '${CLICKHOUSE_PASSWORD}' --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-0}
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: pg
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-uav_search}
      POSTGRES_USER: ${POSTGRES_USER:-mvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CLICKHOUSE_HOST: ch
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-uav_search}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mvi}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      ENABLED_VECTOR_BACKENDS: ${ENABLED_VECTOR_BACKENDS:-clickhouse}
      DEFAULT_VECTOR_BACKEND: ${DEFAULT_VECTOR_BACKEND:-clickhouse}
      ENABLED_DIMENSIONS: ${ENABLED_DIMENSIONS:-512}
      FILTER_EXECUTION_MODE: ${FILTER_EXECUTION_MODE:-pushdown}
      REQUIRE_SECURE_CREDENTIALS: "true"
      ARTIFACTS_ROOT: /workspace/artifacts
      DATA_ROOT: /workspace/data
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./artifacts:/workspace/artifacts
      - ${DATA_ROOT:-./data}:/workspace/data:ro
      - ./datasets:/workspace/datasets:ro
    depends_on:
      pg:
        condition: service_healthy
      ch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    restart: unless-stopped
    mem_limit: ${UI_MEMORY_LIMIT:-0}
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:7860:7860"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pg_data:
  ch_data:
