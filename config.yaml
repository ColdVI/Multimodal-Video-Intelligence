window:
  size_s: 8.0
  stride_s: 4.0
  min_window_s: 2.0

merge:
  gap_tolerance_s: 10.0

eval:
  iou_threshold: 0.5
  top_k: 10

paths:
  videos_dir: data/raw/videos
  manifest: data/raw/manifest.json
  annotations_dir: data/raw/VisDrone2019-MOT-train/annotations
  windows: data/windows.json
  features: data/features.json
  groundtruth: data/groundtruth/gt.json

clickhouse:
  host: localhost
  port: 8123

# Config-driven dataset registry (bkz. datasets/registry.py). query_count
# GERCEK, dogrulanmis degerlerdir - tahmin degil:
#   visdrone: eval/make_groundtruth.py::build_queries() programatik olarak
#     28 dondurur (dogrulandi: `python -c "from eval.make_groundtruth import
#     build_queries; print(len(build_queries()))"` -> 28). data/groundtruth/
#     gt.json'daki 6 kayit ESKI bir 5-sekans smoke ciktisidir (STATUS.md'nin
#     erken bolumu), bench/ bu dosyayi OKUMAZ - build_queries()'i CANLI cagirir.
#   msrvtt_1ka: data/downloads/msrvtt/msrvtt_test_1k.json 1000 essiz
#     video_id icerir (dogrulandi, MSR-VTT validasyon oturumu).
datasets:
  visdrone:
    adapter: visdrone
    retrieval_backend: clickhouse
    has_structured_filters: true
    has_temporal_windows: true
    evaluation_regime: filtered_video_interval
    query_count: 28
    dataset_version: "VisDrone2019-MOT-train"
    manifest: data/raw/manifest.json
    annotations_dir: data/raw/VisDrone2019-MOT-train/annotations
    videos_dir: data/raw/videos
    license: "CC BY-NC-SA 3.0 (AISKYEYE/Tianjin University aiskyeye.com - web aramasiyla dogrulandi, orijinal LICENSE dosyasi bu oturumda acilmadi)"

  msrvtt_1ka:
    adapter: msrvtt
    retrieval_backend: artifact_matrix
    has_structured_filters: false
    has_temporal_windows: false
    evaluation_regime: text_to_video
    query_count: 1000
    dataset_version: "1k-A test split"
    split: data/downloads/msrvtt/msrvtt_test_1k.json
    videos_dir: data/downloads/msrvtt/videos
    license: "UNKNOWN (bu oturumda dogrulanamadi - HF repo sayfasi acik lisans metni surmuyordu, taniniz gerekiyor)"

  # CapERA (Bashmal ve ark. 2023, MDPI Remote Sensing 15(8):2139) - ERA aerial
  # event dataset'inin captioning katmani. Faz 8 quality protokolu YALNIZ
  # test splitidir: 1391 video x 5 caption = 6955 query/GT. Kaynak caption
  # provenance'i vermedigi icin caption_source daima "unknown" kalir.
  capera:
    adapter: capera
    retrieval_backend: artifact_matrix
    has_structured_filters: false
    has_temporal_windows: false
    evaluation_regime: text_to_video
    query_count: 6955
    dataset_version: "CapERA (Bashmal ve ark. 2023) train+test caption release"
    quality_dataset_version: "CapERA (Bashmal ve ark. 2023) test caption release"
    train_split: data/downloads/capera/CapERA_DATASET_train.json
    test_split: data/downloads/capera/CapERA_DATASET_test.json
    quality_split: test
    quality_item_count: 1391
    captions_per_item: 5
    quality_query_count: 6955
    fixed_duration_s: 5.0
    # Colab handoff: ERA_Dataset.zip Colab'in KENDI lokal diskine (/content,
    # Drive DEGIL) acilir - Drive'dan Drive'a acmak 6GB'da 15-30dk surer,
    # /content'e acmak 2-5dk. CapERAAdapter.load_video() var-olmayan bir
    # yol dondurur - caller .exists() ile kontrol eder (bkz. notebook 02).
    videos_dir: /content/ERA_Dataset/Videos
    license: "UNKNOWN (CapERA makalesi/MDPI sayfasinda acik bir veri lisansi bulunamadi - web aramasiyla dogrulanamadi)"

# Faz 3: dedektor varyant registry'si. class_map, o checkpoint'in kendi
# cikti sinif ID'sini bizim filtre kolon kavramimiza (person/car/bus/truck)
# baglar; ayni kavrama birden fazla sinif ID'si dusebilir (ör. VisDrone
# pedestrian+people -> person). Yeni varyant eklemek: checkpoint dosyasini
# weights/ altina koy, buraya bir girdi ekle - kod degisikligi gerekmez.
detector:
  # Faz 3 bake-off karari (73 pencere, gercek veri): yolov8n_visdrone en
  # hizli (1.61 fps vs yolo26x_coco 0.82 fps CPU'da) VE downstream
  # Recall/Precision@10'da en az esdeger (cogu kategoride daha iyi
  # precision). Detay: TASKS.md Faz 3, artifacts/detector_bakeoff.json.
  default_variant: yolov8n_visdrone
  n_sample: 6
  variants:
    yolo26x_coco:
      checkpoint: yolo26x.pt
      taxonomy: coco
      class_map: {0: person, 2: car, 5: bus, 7: truck}
    yolov8n_visdrone:
      checkpoint: weights/yolo_visdrone/best.pt
      taxonomy: visdrone
      class_map: {0: person, 1: person, 3: car, 5: truck, 8: bus}
    yolov8s_visdrone:
      checkpoint: weights/yolo_visdrone_s/best.pt
      taxonomy: visdrone
      class_map: {0: person, 1: person, 3: car, 5: truck, 8: bus}

# true iken tum HF from_pretrained cagrilari local_files_only=True ile
# yuklenir (air-gapped kurulum). HF_HUB_OFFLINE=1 ortam degiskeni ayni
# etkiyi config'e dokunmadan tetikler.
offline_mode: false

# Faz 1 bench subset: 56 VisDrone-MOT sekansindan secilmis 19 sekans.
# Secim kaniti: scripts/select_bench_subset.py (kisi/arac yogunlugu, otobus/
# kamyon varligi, kare-parlakligi proxy'si ile cesitlilik). Ilk 5'i mevcut
# smoke sekanslariyla ortak (data/raw/manifest.json) - tam CPU ingest saatler
# surdugu icin bench raporlari bu subset uzerinde kosar; CUDA'li ortamda
# tam 56-sekans set'e gecis ayri, olculu bir adimdir.
# Faz 5: fast/balanced/accurate profilleri. YALNIZCA gercek olculen
# eksenler (dedektor varyanti: Faz 3 bake-off; embedding modeli: Faz 1/4
# bench) degisir. window/stride/n_sample profil basina FARKLILASTIRILMADI
# cunku bu oturumda ablate edilmedi (bkz. TASKS.md Faz 3 "yapilmadi"
# maddeleri) - tahminle deger yazmamak icin ucu de mevcut ust-seviye
# window/n_sample degerlerini kullanir.
profiles:
  fast:
    detector_variant: yolov8n_visdrone   # Faz 3: en hizli (1.61 fps CPU)
    embedding_model: xclip_hf_zeroshot   # Faz 1: en hizli sorgu (512d)
    search_strategy: auto
  balanced:
    detector_variant: yolov8n_visdrone   # Faz 3 kazanani, downstream esdeger/daha iyi
    embedding_model: siglip2_frameavg    # Faz 1: xclip'e yakin kalite, X-CLIP'ten ~3x yavas ama hala CPU'da pratik
    search_strategy: auto
  accurate:
    detector_variant: yolov8n_visdrone   # truck recall'da yolo26x_coco daha iyi (Faz 3) ama downstream farki kucuk
    embedding_model: siglip2_frameavg    # Qwen3-VL-Embedding-2B CPU'da pratik degil (Faz 4: ~14.5 dk/pencere);
                                         # GPU'da dogrulanirsa (bkz. scripts/colab_gpu_bench.py) qwen3vl_emb_512
                                         # (MRL: 2048d kalitesiyle esdeger, 4x kucuk) bu profile terfi eder
    search_strategy: prefilter           # Faz 2: secici filtrede tek guvenli strateji

bench:
  subset:
    - uav0000013_01073_v   # en kisa (58 kare), bus/truck yok
    - uav0000072_04488_v   # en karanlik (61.7), truck var bus yok, yuksek kisi
    - uav0000138_00000_v   # bus var, yuksek kisi (58.5 ort), parlak (132)
    - uav0000266_04830_v   # truck var, cok seyrek trafik, parlak (180.2)
    - uav0000361_02323_v   # bus+truck, parlak (159.7)
    - uav0000126_00001_v   # en yogun trafik (bus+truck+araba 107 ort)
    - uav0000357_00920_v   # bus+truck, uzun sure (691 kare)
    - uav0000084_00000_v   # bus/truck yok, araba=0, sadece yaya sahnesi
    - uav0000308_00000_v   # bus/truck yok, orta yogunluk
    - uav0000279_00001_v   # truck var bus yok, yuksek araba yogunlugu
    - uav0000295_02300_v   # bus+truck, orta yogunluk
    - uav0000278_00001_v   # bus+truck, en uzun sure (962 kare), parlak
    - uav0000289_00001_v   # bus/truck yok, en parlak (189.3)
    - uav0000266_03598_v   # truck var, cok seyrek (araba 3.16, kisi 3.0)
    - uav0000263_03289_v   # bus+truck, kisi=0 uc-durum
    - uav0000071_03240_v   # bus/truck yok, karanlik (68.4)
    - uav0000150_02310_v   # truck var bus yok, medyana yakin parlaklik
    - uav0000239_12336_v   # bus+truck, dusuk-orta yogunluk
    - uav0000363_00001_v   # bus+truck, orta yogunluk, karanlik-yakin (96.9)
