name: multimodal-video-intelligence-qdrant

services:
  pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uav_search}
      POSTGRES_USER: ${POSTGRES_USER:-mvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    expose: ["5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvi} -d ${POSTGRES_DB:-uav_search}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    expose: ["6333", "6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: pg
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-uav_search}
      POSTGRES_USER: ${POSTGRES_USER:-mvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      QDRANT_URL: http://qdrant:6333
      ENABLED_VECTOR_BACKENDS: qdrant
      DEFAULT_VECTOR_BACKEND: qdrant
      ENABLED_DIMENSIONS: ${ENABLED_DIMENSIONS:-512}
      FILTER_EXECUTION_MODE: ${FILTER_EXECUTION_MODE:-pushdown}
      REQUIRE_SECURE_CREDENTIALS: "true"
      ARTIFACTS_ROOT: /workspace/artifacts
      DATA_ROOT: /workspace/data
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./artifacts:/workspace/artifacts
      - ${DATA_ROOT:-./data}:/workspace/data:ro
      - ./datasets:/workspace/datasets:ro
    depends_on:
      pg:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  ui:
    build:
      context: .
      dockerfile: service/Dockerfile.ui
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:7860:7860"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  qdrant_data:
